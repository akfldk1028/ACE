
# Project Specification Example
# Drop this file in projects/queue/ to trigger 24/7 execution

name: "Example REST API"
description: "Build a REST API server with FastAPI and PostgreSQL"

# Project Goals (what to achieve)
goals:
  - "Create user authentication with JWT"
  - "Implement CRUD endpoints for resources"
  - "Add database models and migrations"
  - "Write unit and integration tests"
  - "Generate API documentation"

# Requirements
requirements:
  functional:
    - "User registration and login"
    - "Token-based authentication"
    - "Resource CRUD operations"
    - "Input validation"
  non_functional:
    - "Response time < 200ms"
    - "Test coverage > 80%"
  constraints:
    - "Python 3.11+"
    - "PostgreSQL 14+"
  dependencies:
    - "FastAPI"
    - "SQLAlchemy"
    - "Pydantic"
    - "pytest"

# Technology Stack
tech_stack:
  - "Python 3.11"
  - "FastAPI"
  - "SQLAlchemy 2.0"
  - "PostgreSQL"
  - "Docker"

# Output Directory
output_path: "./output/example-api"

# Agent Configuration
agents:
  use_auto_claude: true
  use_ag_autogen: true
  use_ag_law: false
  preferred_agents:
    - "auto_claude_coder"
    - "auto_claude_qa_reviewer"

# Pipeline Configuration
pipeline:
  pattern: "auto"  # auto, sequential, parallel, critic_loop
  max_iterations: 5
  parallel_limit: 3
  timeout_minutes: 60

# Execution
priority: "medium"  # high, medium, low
auto_start: true
