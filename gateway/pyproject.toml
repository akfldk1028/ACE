[project]
name = "arr-gateway"
version = "0.1.0"
description = "Hermes plugin: ARR (건축법규/토지분석) 도구 모음"
# Hermes installs Python 3.11 via uv; system Python 3.10도 호환 (httpx만 필요)
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
]

[project.entry-points."hermes_agent.plugins"]
arr-gateway = "arr_gateway"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arr_gateway"]
