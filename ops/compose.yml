# Phase 2 of the agent-infra plan (plans/gleaming-wibbling-shell.md): the services with zero ARR coupling.
#
#   neo4j        the law graph (58 statutes, ~38k nodes) - Enterprise, because the Desktop store is block format,
#                which only Enterprise reads; NEO4J_ACCEPT_LICENSE_AGREEMENT=yes records the owner's decision (2026-09-24)
#   law-search   :8011 hybrid retrieval over that graph with local bge-m3 embeddings (CPU here; compose.gpu.yml for CUDA)
#   revision / requirement / design-intent   the three pure A2A agents (:8303 :8305 :8306)
#
# Every port is published on 127.0.0.1 only. The callers - Orchestrator worker, Law, MasterPlan, Site, Program - stay on
# the host and keep their Phase 1 catalog URLs, so the Orchestrator configuration does not change at all.
# Migration order and rollback per service: the plan's step table. Never start a host serve-a2a.sh for a port a
# container holds - stop the container first (the script refuses to kill a non-python owner, but do not rely on it).
name: ace

x-agent-health: &agent-health
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 20s

services:
  neo4j:
    image: neo4j:2025.08.0-enterprise   # exactly the Desktop version - a newer image would upgrade the store on first start
    environment:
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}      # any other NEO4J_* variable is read as a server setting, so nothing else goes here
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*,genai.*
    volumes:
      - neo4j-data:/data
      - ./neo4j/plugins:/plugins:ro          # apoc + genai jars of the same version, copied from Desktop (gitignored)
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]   # discovery endpoint answers only once the DBMS is up
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 90s
    mem_limit: 4g
    restart: unless-stopped

  law-search:
    build:
      context: ../agents/Lawagent/server/law-search
      additional_contexts:
        a2a: ../agents/a2a
      args:
        A2A_SHA: fce163c6720022c9ca6636a8a6b591ebf69e7bd7
        TORCH_INDEX: https://download.pytorch.org/whl/cpu
    # the host .env is read as-is (NEO4J_USER/PASSWORD, TYPESAFE_API_KEY, EMBED_PROVIDER ...); its
    # NEO4J_URI=bolt://localhost:7687 stays for host processes and is overridden below for the container only
    env_file: ../agents/Lawagent/server/law-search/.env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      EMBED_LOCAL_DEVICE: cpu
      HF_HOME: /hf
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    depends_on:
      neo4j:
        condition: service_healthy           # lifespan reads the domain list from the graph
    volumes:
      - hf-cache:/hf                         # seeded once by scripts/seed-hf-cache.ps1 (bge-m3, 2.3 GB)
    ports:
      - "127.0.0.1:8011:8011"
    healthcheck:
      # a real search, so the first pass doubles as model warm-up
      test: ["CMD", "python", "-c", "import json,sys,urllib.request as u; r=u.urlopen(u.Request('http://127.0.0.1:8011/api/search', data=json.dumps({'query':'건축선','limit':1}).encode(), headers={'Content-Type':'application/json'}), timeout=90); sys.exit(0 if r.status==200 else 1)"]
      interval: 60s
      timeout: 100s
      retries: 5
      start_period: 240s
    mem_limit: 6g
    restart: unless-stopped

  revision:
    build:
      context: ./docker
      dockerfile: Dockerfile.agent
      args: { AGENT: RevisionAgent, LOCK: requirements-revision.lock.txt }
      additional_contexts:
        agent: ../agents/RevisionAgent
        a2a: ../agents/a2a
    # bind everywhere inside, advertise the address the HOST caller reaches (the SDK sends to the card's URL)
    command: ["python", "-X", "utf8", "a2a_service/server.py", "--host", "0.0.0.0", "--port", "8303", "--advertise", "127.0.0.1"]
    ports:
      - "127.0.0.1:8303:8303"
    volumes:
      - ../agents/RevisionAgent/runs:/app/agents/RevisionAgent/runs      # hop log stays where the host copy wrote it
    healthcheck:
      <<: *agent-health
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8303/.well-known/agent-card.json', timeout=3)"]
    mem_limit: 512m
    restart: unless-stopped

  requirement:
    build:
      context: ./docker
      dockerfile: Dockerfile.agent
      args: { AGENT: RequirementAgent, LOCK: requirements-requirement.lock.txt }
      additional_contexts:
        agent: ../agents/RequirementAgent
        a2a: ../agents/a2a
    command: ["python", "-X", "utf8", "a2a_service/server.py", "--host", "0.0.0.0", "--port", "8305", "--advertise", "127.0.0.1"]
    ports:
      - "127.0.0.1:8305:8305"
    volumes:
      - ../agents/RequirementAgent/runs:/app/agents/RequirementAgent/runs
    healthcheck:
      <<: *agent-health
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8305/.well-known/agent-card.json', timeout=3)"]
    mem_limit: 512m
    restart: unless-stopped

  design-intent:
    build:
      context: ./docker
      dockerfile: Dockerfile.agent
      args: { AGENT: DesignIntentAgent, LOCK: requirements-intent.lock.txt }
      additional_contexts:
        agent: ../agents/DesignIntentAgent
        a2a: ../agents/a2a
    command: ["python", "-X", "utf8", "a2a_service/server.py", "--host", "0.0.0.0", "--port", "8306", "--advertise", "127.0.0.1"]
    ports:
      - "127.0.0.1:8306:8306"
    volumes:
      - ../agents/DesignIntentAgent/runs:/app/agents/DesignIntentAgent/runs
    healthcheck:
      <<: *agent-health
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8306/.well-known/agent-card.json', timeout=3)"]
    mem_limit: 512m
    restart: unless-stopped

volumes:
  neo4j-data:
  hf-cache:
    name: ace_hf-cache                       # created and filled by scripts/seed-hf-cache.ps1 before first start
    external: true
