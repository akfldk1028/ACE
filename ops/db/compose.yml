# The law graph - its own compose project (ace-db) because a database has a different life from application code:
# it is started once, migrated by dump/load (scripts/neo4j-dump-load.ps1), and never rebuilt or torn down with the agents.
# `docker compose down` here never runs as part of an agent redeploy; `down -v` would delete the graph and is never scripted.
#
# Enterprise because the Desktop store is block format, which only Enterprise reads; NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
# records the owner's decision (2026-09-24). Image pinned to the Desktop version - a newer one would upgrade the store.
# The password lives in ./.env (gitignored) and nowhere else; applications bring their own credentials.
# Applications reach it as bolt://neo4j:7687 on the shared network ace-net (created here, joined by ../compose.yml),
# host processes as bolt://localhost:7687 through the published loopback port.
name: ace-db

services:
  neo4j:
    image: neo4j:2025.08.0-enterprise
    environment:
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}      # any other NEO4J_* variable is read as a server setting, so nothing else goes here
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*,genai.*
    volumes:
      - neo4j-data:/data
      - ../neo4j/plugins:/plugins:ro         # apoc + genai jars of the same version, copied from Desktop (gitignored)
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]   # discovery endpoint answers only once the DBMS is up
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 90s
    mem_limit: 4g
    restart: unless-stopped
    networks: [ace]

volumes:
  neo4j-data:
    name: ace_neo4j-data                     # the volume the 2026-09-26 load filled; kept under its original name
    external: true

networks:
  ace:
    name: ace-net                            # owned here; ../compose.yml joins it as external
